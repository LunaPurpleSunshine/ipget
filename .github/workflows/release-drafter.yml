name: Release Drafter

on:
  workflow_dispatch:
  push:
    # branches to consider in the event; optional, defaults to all
    branches:
      - master
  schedule:
    - cron: "0 9 5 * *"

permissions: {}

jobs:
  update_release_draft:
    # Drafts the next release notes as PRs are merged into "master".
    # PR autolabelling runs in the PR Manager workflow.
    runs-on: ubuntu-latest
    permissions:
      # write permission is required to create a github release
      contents: write
      # read permission is required to read PR labels
      pull-requests: read
    outputs:
      tag_name: ${{ steps.create_release.outputs.tag_name }}
      body: ${{ steps.create_release.outputs.body }}
    steps:
      - name: Create Draft Release
        id: create_release
        uses: release-drafter/release-drafter@v7
        with:
          commitish: master

  publish_release:
    # Only run this job on the scheduled cron job, not on pushes or PRs
    if: ${{ github.event_name == 'schedule' }}
    needs: update_release_draft
    runs-on: ubuntu-latest
    permissions:
      contents: write  # for gh actions to create a release
    env:
      GH_TOKEN: ${{ secrets.IPGET_PUBLISH_TOKEN }}
      # Passed via env rather than interpolated into the scripts, as the body
      # contains PR titles and must not be evaluated by the shell
      TAG_NAME: ${{ needs.update_release_draft.outputs.tag_name }}
      RELEASE_BODY: ${{ needs.update_release_draft.outputs.body }}

    steps:
      - name: Check Release
        id: check_release
        run: |
          # Check if there is a draft release and exit if not
          draft=$(gh release view "$TAG_NAME" --json isDraft --jq '.isDraft' --repo "$GITHUB_REPOSITORY")
          do_release_check=false
          if [ "$draft" != "true" ]; then
            echo "No draft release to publish"
            do_release_check=false
          # Check if the body contains "No changes" and exit if so
          elif printf '%s\n' "$RELEASE_BODY" | grep -q "\* No changes"; then
            echo "No changes to publish"
            do_release_check=false
          else
            do_release_check=true
          fi
          echo "do_release=$do_release_check"
          echo "do_release=$do_release_check" >> "$GITHUB_OUTPUT"

      - name: Publish Release
        id: publish_release
        if: ${{ steps.check_release.outputs.do_release == 'true' }}
        run: |
          echo "Publishing draft release $TAG_NAME"
          gh release edit "$TAG_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
