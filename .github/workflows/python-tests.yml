name: Python Checks
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - master

env:
  # renovate: datasource=github-releases depName=uv packageName=astral-sh/uv
  UV_VERSION: "0.13.5"

# Cancel superseded runs on the same PR; pushes to master always run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Get repo, python, and uv
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        id: setup-python
        with:
          python-version-file: "pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: ${{env.UV_VERSION}}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # --locked fails if uv.lock is out of date with pyproject.toml
      - name: uv install dependencies
        run: uv sync --locked --no-default-groups --group lint

      - name: Linter
        # Update output format to enable automatic inline annotations.
        run: uv run --no-sync ruff check --output-format=github src/ tests/

      - name: Formatter
        run: uv run --no-sync ruff format --diff src/ tests/

  mypy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Get repo, python, and uv
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        id: setup-python
        with:
          python-version-file: "pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: ${{env.UV_VERSION}}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # mypy needs the test dependencies too, as it checks tests/
      - name: uv install dependencies
        run: uv sync --locked --no-default-groups --group ci

      - name: Run mypy
        run: uv run --no-sync mypy src/ tests/

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Get repo, python, and uv
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        id: setup-python
        with:
          python-version-file: "pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: ${{env.UV_VERSION}}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: uv install dependencies
        run: uv sync --locked --no-default-groups --group test

      # Run python tests
      - name: Run pytest
        uses: pavelzw/pytest-action@v2.2.0
        with:
          custom-pytest: uv run --no-sync pytest
          custom-arguments: -r a
          report-title: Pytest Report
          click-to-expand: true
          verbose: true
          emoji: true
        env:
          IPGET_TEST_HEALTHCHECK_SERVER: ${{secrets.PYTEST_IPGET_HEALTHCHECK_SERVER}}
          IPGET_TEST_HEALTHCHECK_UUID: ${{secrets.PYTEST_IPGET_HEALTHCHECK_UUID}}
          IPGET_TEST_DISCORD_WEBHOOK: ${{secrets.PYTEST_IPGET_DISCORD_WEBHOOK}}
