name: Build & Publish Docker Image

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-alpha.*"
      - "v*.*.*-beta.*"
      - "v*.*.*-rc.*"
  # Build and test the image on every PR (publishing is skipped)
  pull_request:
  # Run build manually from the Actions tab, will be tagged with branch name
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Cancel superseded runs on the same PR, but never interrupt a publish
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ipget:build-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Basic image test
        id: test_container
        run: |
          docker run --rm --user root \
            -e "IPGET_LOG_LEVEL=DEBUG" \
            -e "IPGET_DB_TYPE=SQLite" \
            -e "IPGET_SQLITE_DATABASE=:memory:" \
            ipget:build-test

  publish:
    # Only publish on tag pushes or manual runs, never from PRs
    if: ${{ github.event_name != 'pull_request' }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: lowercase repository name
        id: imagename
        uses: Entepotenz/change-string-case-action-min-dependencies@v1
        with:
          string: ${{ env.IMAGE_NAME }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.imagename.outputs.lowercase }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      - name: GitHub Container Registry Login
        uses: docker/login-action@v4
        with:
          registry: ${{env.REGISTRY}}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push all platforms
        id: docker_tag_semver
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64, linux/arm64
          push: true
          cache-from: type=gha
          labels: |
            ${{ steps.meta.outputs.labels }}
            "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}"
            "org.opencontainers.image.description=Gets public ip and writes to a database. Optionally notifies on change, and pings healthchecks.io"
            "org.opencontainers.image.licenses=MIT"
          tags: ${{ steps.meta.outputs.tags }}

      - name: Push alpha/beta/rc with :dev tag
        id: docker_tag_dev
        uses: docker/build-push-action@v7
        if: contains(github.ref_name, '-alpha.') || contains(github.ref_name, '-beta.')
        with:
          context: .
          platforms: linux/amd64, linux/arm64
          push: true
          cache-from: type=gha
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.REGISTRY }}/${{ steps.imagename.outputs.lowercase }}:dev
