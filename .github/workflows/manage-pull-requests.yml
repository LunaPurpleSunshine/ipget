name: PR Manager
on:
  pull_request:
    types:
      - opened
      - reopened
      - labeled
      - unlabeled
      - synchronize

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PR_URL: ${{ github.event.pull_request.html_url }}

# Only the latest event per PR matters, e.g. several labels added at once.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

# Renovate PRs are labelled by renovate.json, so they need no job here.
jobs:
  pre-commit-ci:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'pre-commit-ci[bot]'
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Add maintenance label
        id: label-maintenance
        run: gh pr edit "$PR_URL" --add-label "maintenance"

      - name: Assign owner
        id: assign-owner
        run: gh pr edit "$PR_URL" --add-assignee "$GITHUB_REPOSITORY_OWNER"

      - name: Set auto-merge when tests pass
        id: auto-merge
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: gh pr merge "$PR_URL" --auto --squash

  check-labels:
    # Runs after pre-commit-ci when that job runs, and on its own when it is
    # skipped (every PR not opened by pre-commit-ci).
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    needs:
      - pre-commit-ci
    permissions:
      pull-requests: read
    steps:
      - name: Check semver label
        id: semver_label_check
        uses: agilepathway/label-checker@v2.0.46
        # Documentation and maintenance PRs should not bump the version.
        # PRs from pre-commit-ci are skipped, as the label it just got is not in this event's payload.
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'documentation') && !contains(github.event.pull_request.labels.*.name, 'maintenance') && github.event.pull_request.user.login != 'pre-commit-ci[bot]' }}
        with:
          prefix_mode: true
          one_of: "semver:"
          repo_token: ${{ secrets.GITHUB_TOKEN }}
