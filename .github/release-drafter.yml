name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  # Changelog sections
  - title: 'Features'
    when:
      labels:
        - 'enhancement'
  - title: 'Bug Fixes'
    when:
      labels:
        - 'bugfix'
        - 'bug'
  - title: 'Documentation'
    when:
      labels:
        - 'documentation'
  - title: 'Updated Dependencies'
    when:
      labels:
        - 'dependencies:production'
  - title: 'Maintenance'
    collapse-after: 1
    when:
      labels:
        - 'maintenance'
        - 'dependencies:development'
        - 'github_actions'

  # Version resolution (driven only by the semver:* labels)
  - type: version-resolver
    semver-increment: major
    when:
      labels:
        - 'semver:major'
  - type: version-resolver
    semver-increment: minor
    when:
      labels:
        - 'semver:minor'
  - type: version-resolver
    semver-increment: patch
    when:
      labels:
        - 'semver:patch'
  # Fallback when no semver:* label matches
  - type: version-resolver
    semver-increment: patch

change-template: '- $TITLE (#$NUMBER) by @$AUTHOR'
change-title-escapes: '\<*_&' # You can add # and @ to disable mentions, and add ` to disable code blocks.

autolabeler:
  - labels:
      - 'maintenance'
    branch:
      - '/chore-.+/'
  - labels:
      - 'documentation'
    branch:
      - '/docs-.+/'
  - labels:
      - 'bug'
    branch:
      - '/fix-.+/'
      - '/bugfix-.+/'
  - labels:
      - 'enhancement'
    branch:
      - '/feature-.+/'
      - '/feat-.+/'

template: |
  # Changes

  $CHANGES
